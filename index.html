<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rich in Memes</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:#151515;
  font-family:Arial,sans-serif;
}

.cardboard{
  width:min(900px,100%);
  min-height:90vh;
  padding:60px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(80,45,15,.08) 0px,
      rgba(80,45,15,.08) 2px,
      transparent 2px,
      transparent 7px
    ),
    linear-gradient(135deg,#c99b60,#e0b77b,#bd8b50);

  border:12px solid #9a6a38;
  box-shadow:0 20px 60px #000;
}

.content{
  width:min(720px,100%);
  padding:45px 25px;
  background:rgba(224,183,123,.82);
  border:4px solid #6b4523;
  box-shadow:12px 12px 0 rgba(60,35,15,.5);
  transform:rotate(-1deg);
}

h1{
  margin:0;
  font-size:clamp(48px,10vw,100px);
  line-height:.9;
  font-weight:900;
  color:#17110b;
  text-shadow:3px 3px 0 #f0d09e;
}

.smile{
  font-size:70px;
  margin:25px 0;
}

p{
  font-size:clamp(18px,3vw,27px);
  font-weight:bold;
  color:#24180d;
}

.badge{
  display:inline-block;
  margin-top:20px;
  padding:12px 22px;
  border:3px solid #24180d;
  font-weight:900;
  background:#d8ae72;
}

small{
  display:block;
  margin-top:30px;
  opacity:.65;
}
</style>
</head>

<body>

<div class="cardboard">
  <div class="content">

    <h1>RICH<br>IN<br>MEMES</h1>

    <div class="smile">🙂</div>

    <p>Rich in memes.<br>
    Poor in everything else.</p>

    <div class="badge">MEME PROJECT</div>

    <small>A meme concept. No promises of profit.</small>

  </div>
</div>

</body>
</html>
