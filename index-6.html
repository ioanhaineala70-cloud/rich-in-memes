<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rich in Memes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  background:#151515;
  color:#17130e;
  display:flex;
  justify-content:center;
  padding:28px 16px;
}
.page{
  width:min(1000px,100%);
  min-height:calc(100vh - 56px);
  border-radius:8px;
  overflow:hidden;
  position:relative;
  box-shadow:0 18px 60px rgba(0,0,0,.55);
  background:
    linear-gradient(rgba(137,91,45,.18),rgba(137,91,45,.18)),
    url("rich-in-memes.png") center/cover fixed;
}
.overlay{
  min-height:calc(100vh - 56px);
  padding:clamp(32px,7vw,90px) clamp(20px,7vw,90px);
  background:rgba(201,157,99,.38);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.logo{
  background:#d5a96f;
  border:3px solid #5e3e20;
  padding:10px 20px;
  font-weight:900;
  font-size:clamp(28px,6vw,54px);
  letter-spacing:-2px;
  transform:rotate(-1deg);
  box-shadow:8px 8px 0 rgba(55,35,18,.45);
  margin-bottom:42px;
}
.hero{
  max-width:760px;
  padding:clamp(25px,5vw,55px);
  background:rgba(211,169,111,.88);
  border:2px solid #6a4826;
  box-shadow:12px 14px 0 rgba(55,35,18,.45);
  transform:rotate(.4deg);
}
h1{
  margin:0;
  font-size:clamp(48px,10vw,104px);
  line-height:.88;
  letter-spacing:-6px;
  font-weight:950;
}
.tagline{
  font-size:clamp(18px,3vw,28px);
  font-weight:700;
  margin:24px 0 30px;
}
.smile{font-size:clamp(50px,8vw,80px);margin:4px 0 28px}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-block;
  text-decoration:none;
  color:#f7ead5;
  background:#21180f;
  border:2px solid #4e351e;
  padding:14px 22px;
  border-radius:5px;
  font-weight:800;
}
.note{
  margin-top:38px;
  font-size:13px;
  opacity:.72;
  max-width:600px;
}
</style>
</head>
<body>
<main class="page">
  <div class="overlay">
    <div class="logo">RICH IN MEMES 🙂</div>
    <section class="hero">
      <h1>RICH<br>IN<br>MEMES</h1>
      <div class="smile">🙂</div>
      <p class="tagline">Rich in memes. Poor in everything else.</p>
      <div class="buttons">
        <a class="btn" href="#">MEME PROJECT</a>
        <a class="btn" href="#">COMMUNITY</a>
      </div>
      <p class="note">A meme concept. No promises of profit.</p>
    </section>
  </div>
</main>
</body>
</html>
